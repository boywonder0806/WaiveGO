# WaiveGO core services — meant to run on a single DigitalOcean Droplet for now.
#
# Everything here lives on an internal-only Docker network (`backend`). Only
# `waivego-api` publishes a port, and it's bound to 127.0.0.1 — reachable via SSH
# tunnel from a dev machine, NOT from the public internet. That's deliberate:
# CompreFace holds guest biometric data, waivego-db holds guest PII, and
# waivego-api itself has no auth yet — none of this is ready to be public. Making
# the iPad reach it for real needs a domain + TLS (reverse proxy in front) and auth
# first — see infra/README.md and services/api/README.md's known gaps.
#
# Usage:
#   cp .env.example .env   # then fill in real secrets, do NOT commit .env
#   docker compose up -d
#
# See infra/README.md for the full Droplet setup runbook.
#
# ─── Memory budget (sized for a 4GB / 2vCPU Droplet) ────────────────────────────
# Revised from a live OOM crash loop: CompreFace's default UWSGI_PROCESSES=2 means
# compreface-core forks TWO worker processes, and each one independently loads its
# own full copy of the face detection/landmarks/age/gender/mask/pose models — so the
# original 900m cap (sized for one copy) was killed by the kernel (signal 9) under
# two. Fix: UWSGI_PROCESSES=1 (a single kiosk has no need for concurrent workers
# anyway) plus a bigger cap for that one worker's real footprint, with everything
# else trimmed down to what was actually observed in `docker stats` (mostly tens of
# MB, nowhere near their old caps):
#   compreface-postgres-db   200m   (observed ~50m)
#   compreface-admin         400m   (JVM heap capped at 300m; observed ~110m)
#   compreface-api           700m   (JVM heap capped at 550m; observed ~110m)
#   compreface-core         1700m   (Python/TensorFlow, 1 worker — this is the one
#                                    that actually needs the room)
#   compreface-fe              64m  (nginx, lightweight)
#   waivego-db                200m
#   ────────────────────────────
#   total                   ~3.26GB, leaving ~550MB for the OS/Docker on a 4GB box
# If you resize to a bigger Droplet later, raise both the mem_limits here and the
# *_java_options heap sizes / uwsgi_processes in .env.example together.

volumes:
  compreface-postgres-data:
  waivego-postgres-data:

networks:
  backend:
    driver: bridge

services:
  # ─── Facial recognition (CompreFace) ────────────────────────────────────────────
  # https://github.com/exadel-inc/CompreFace

  compreface-postgres-db:
    image: ${registry}compreface-postgres-db:${POSTGRES_VERSION}
    restart: always
    container_name: compreface-postgres-db
    networks: [backend]
    mem_limit: 200m
    environment:
      - POSTGRES_USER=${postgres_username}
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_DB=${postgres_db}
    volumes:
      - compreface-postgres-data:/var/lib/postgresql/data

  compreface-admin:
    restart: always
    image: ${registry}compreface-admin:${ADMIN_VERSION}
    container_name: compreface-admin
    networks: [backend]
    mem_limit: 400m
    environment:
      - POSTGRES_USER=${postgres_username}
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_URL=jdbc:postgresql://${postgres_domain}:${postgres_port}/${postgres_db}
      - SPRING_PROFILES_ACTIVE=dev
      - ENABLE_EMAIL_SERVER=${enable_email_server}
      - EMAIL_HOST=${email_host}
      - EMAIL_USERNAME=${email_username}
      - EMAIL_FROM=${email_from}
      - EMAIL_PASSWORD=${email_password}
      - ADMIN_JAVA_OPTS=${compreface_admin_java_options}
      - MAX_FILE_SIZE=${max_file_size}
      - MAX_REQUEST_SIZE=${max_request_size}B
    depends_on:
      - compreface-postgres-db
      - compreface-api

  compreface-api:
    restart: always
    image: ${registry}compreface-api:${API_VERSION}
    container_name: compreface-api
    networks: [backend]
    mem_limit: 700m
    depends_on:
      - compreface-postgres-db
    environment:
      - POSTGRES_USER=${postgres_username}
      - POSTGRES_PASSWORD=${postgres_password}
      - POSTGRES_URL=jdbc:postgresql://${postgres_domain}:${postgres_port}/${postgres_db}
      - SPRING_PROFILES_ACTIVE=dev
      - API_JAVA_OPTS=${compreface_api_java_options}
      - SAVE_IMAGES_TO_DB=${save_images_to_db}
      - MAX_FILE_SIZE=${max_file_size}
      - MAX_REQUEST_SIZE=${max_request_size}B
      - CONNECTION_TIMEOUT=${connection_timeout}
      - READ_TIMEOUT=${read_timeout}

  compreface-fe:
    restart: always
    image: ${registry}compreface-fe:${FE_VERSION}
    container_name: compreface-ui
    networks: [backend]
    mem_limit: 64m
    # No `ports:` mapping on purpose — reach the admin UI via `docker compose exec`/an
    # SSH tunnel when you need it (e.g. `ssh -L 8000:localhost:8000 <droplet-ip>` then
    # temporarily add a `ports: ["127.0.0.1:8000:80"]` line), not a public port.
    depends_on:
      - compreface-api
      - compreface-admin
    environment:
      - CLIENT_MAX_BODY_SIZE=${max_request_size}
      - PROXY_READ_TIMEOUT=${read_timeout}ms
      - PROXY_CONNECT_TIMEOUT=${connection_timeout}ms

  compreface-core:
    restart: always
    image: ${registry}compreface-core:${CORE_VERSION}
    container_name: compreface-core
    networks: [backend]
    mem_limit: 1700m
    environment:
      - ML_PORT=3000
      - IMG_LENGTH_LIMIT=${max_detect_size}
      - UWSGI_PROCESSES=${uwsgi_processes}
      - UWSGI_THREADS=${uwsgi_threads}
    healthcheck:
      test: curl --fail http://localhost:3000/healthcheck || exit 1
      interval: 10s
      retries: 0
      start_period: 0s
      timeout: 1s

  # ─── WaiveGO application database ───────────────────────────────────────────────
  # Separate from CompreFace's own Postgres above — this holds WaiveGO's own data
  # (guests, check-ins, cached Smartwaiver records), not face embeddings.

  waivego-db:
    image: postgres:16-alpine
    restart: always
    container_name: waivego-db
    networks: [backend]
    mem_limit: 200m
    environment:
      - POSTGRES_USER=${waivego_db_username}
      - POSTGRES_PASSWORD=${waivego_db_password}
      - POSTGRES_DB=${waivego_db_name}
    volumes:
      - waivego-postgres-data:/var/lib/postgresql/data

  # ─── WaiveGO backend API ─────────────────────────────────────────────────────────
  # Reaches compreface-ui and waivego-db by container name over the `backend`
  # network — no tunneling needed now that it lives on the same Droplet as them.
  #
  # Port is loopback-only (127.0.0.1), same as compreface-fe's temporary tunnel
  # port — reachable via SSH from a dev machine, NOT from the public internet. It
  # is NOT yet safe to publish this publicly: there's no auth on any endpoint (see
  # services/api/README.md), and check-in/enrollment send guest photos, which
  # shouldn't cross the public internet over plain HTTP regardless. Making the iPad
  # reach this for real needs a domain + TLS (reverse proxy in front) and some form
  # of auth first — see infra/README.md.
  waivego-api:
    restart: always
    build:
      context: ../services/api
    container_name: waivego-api
    networks: [backend]
    mem_limit: 300m
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - waivego-db
      - compreface-fe
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${waivego_db_username}:${waivego_db_password}@waivego-db:5432/${waivego_db_name}
      - COMPREFACE_BASE_URL=http://compreface-ui
      - COMPREFACE_RECOGNITION_API_KEY=${compreface_recognition_api_key}
      - SMARTWAIVER_API_KEY=${smartwaiver_api_key}
